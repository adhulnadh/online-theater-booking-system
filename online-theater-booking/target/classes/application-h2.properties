spring.application.name=online-theater-booking
server.port=8080

# H2 In-Memory Database Configuration (MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:theater_booking_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable automatic schema.sql script execution for H2 (Hibernate will generate DDL directly from JPA entities)
spring.sql.init.mode=never

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
